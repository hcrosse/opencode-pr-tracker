telemetry = false
env = false

[install]
auto = "disable"
exact = true
ignoreScripts = true
peer = true
minimumReleaseAge = 604800
# OpenCode V2 ships almost daily. To track the current release, exempt packages whose versions an
# OpenCode release pins (@opencode/*, and when needed effect, @effect/*, or @opentui/*) only while
# that pin is under seven days old. Remove each entry once it ages out, and re-add it when OpenCode
# moves the pin.
minimumReleaseAgeExcludes = [
  "@opencode/plugin",
  "@opencode/cli",
  "@opencode/cli-linux-x64",
  "@opencode/cli-darwin-x64",
  "@opencode/cli-linux-arm64",
  "@opencode/cli-windows-x64",
  "@opencode/cli-darwin-arm64",
  "@opencode/cli-windows-arm64",
  "@opencode/cli-linux-x64-musl",
  "@opencode/cli-linux-arm64-musl",
  "@opencode/cli-linux-x64-baseline",
  "@opencode/cli-darwin-x64-baseline",
  "@opencode/cli-windows-x64-baseline",
  "@opencode/cli-linux-x64-baseline-musl",
  "@opencode/ai",
  "@opencode/client",
  "@opencode/protocol",
  "@opencode/schema",
  "@opencode/util",
  "@opencode/theme",
]
linker = "isolated"
hoist = false
saveTextLockfile = true

[test]
preload = ["@opentui/solid/preload"]
