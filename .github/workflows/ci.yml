name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: bun run lint
          - name: Format
            command: bun run format:check && git diff --check
          - name: Test
            command: bun test
          - name: Build
            command: bun run build
          - name: OpenCode smoke
            command: bun run smoke:opencode
          - name: Package
            command: bun run package:check
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Verify build output
        if: matrix.name == 'Build'
        run: |
          test -z "$(git ls-files -- dist)"
          test -z "$(git status --short --untracked-files=all)"
