name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Verify release
        run: bun run check

      - name: Build package
        run: bun run build

      - name: Pack release
        id: package
        run: |
          artifact_dir="$RUNNER_TEMP/package"
          mkdir -p "$artifact_dir"
          npm pack --ignore-scripts --pack-destination "$artifact_dir"
          shopt -s nullglob
          artifacts=("$artifact_dir"/*.tgz)
          test "${#artifacts[@]}" -eq 1
          artifact_path="${artifacts[0]}"
          sha256="$(sha256sum "$artifact_path" | cut -d ' ' -f 1)"
          printf 'path=%s\nsha256=%s\n' "$artifact_path" "$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          archive: false

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ${{ runner.temp }}/package

      - name: Verify package artifact
        id: package
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          shopt -s nullglob
          artifacts=("$RUNNER_TEMP/package"/*.tgz)
          test "${#artifacts[@]}" -eq 1
          artifact_path="${artifacts[0]}"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$artifact_path" | sha256sum --check --strict
          printf 'path=%s\n' "$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: npm publish "${{ steps.package.outputs.path }}" --access public --ignore-scripts
